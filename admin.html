<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Panitia - Souvenir</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:auto;padding:16px;background:#e8f0f6;color:#0b3a63}
input,textarea,button{width:100%;padding:12px;margin:6px 0;font-size:1rem;border-radius:10px;border:1px solid #9bb;box-sizing:border-box}
button{background:#0b3a63;color:#fff;border:0;font-weight:600}.tabs{display:flex;gap:8px}.tabs button{opacity:.5}.tabs button.on{opacity:1}
#res{padding:16px;border-radius:12px;font-weight:700;margin:10px 0;display:none}.ok{background:#c8f0d0;color:#0a5a1e}.bad{background:#ffd5d5;color:#8a1010}.warn{background:#fff0b8;color:#6b4b00}
table{width:100%;border-collapse:collapse;font-size:.9rem}td{padding:6px;border-bottom:1px solid #cde}
</style></head><body>
<h2>Panitia Souvenir</h2>
<input id="pin" type="password" placeholder="PIN panitia">
<div class="tabs"><button class="on" data-t="scan">Scan</button><button data-t="tamu">Tamu</button></div>
<div id="scan">
 <div id="reader"></div><button id="cam">Buka Kamera</button>
 <input id="man" placeholder="atau ketik kode manual"><button id="go">Proses Kode</button>
 <div id="res"></div>
</div>
<div id="tamu" style="display:none">
 <textarea id="names" rows="6" placeholder="Satu nama per baris"></textarea>
 <button id="add">Tambah &amp; Buat Link</button>
 <button id="ref">Muat Daftar Tamu</button><table id="tb"></table>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id); let sc, busy = false;
const BASE = location.href.replace('admin.html','index.html').split('?')[0];
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('scan').style.display = b.dataset.t === 'scan' ? '' : 'none';
  $('tamu').style.display = b.dataset.t === 'tamu' ? '' : 'none';
});
function show(cls, msg){ const r=$('res'); r.className=cls; r.style.display='block'; r.textContent=msg; }
async function redeem(code){
  if (busy || !code) return; busy = true;
  try {
    const r = await rpc('redeem_souvenir', { p_code: code, p_pin: $('pin').value });
    if (r.status==='ok') show('ok', `✅ ${r.name} — BOLEH ambil souvenir`);
    else if (r.status==='sudah_diambil') show('bad', `❌ ${r.name} SUDAH mengambil (${new Date(r.at).toLocaleString('id-ID')})`);
    else if (r.status==='pin_salah') show('warn','PIN salah');
    else show('bad','Kode tidak dikenal');
  } catch(e){ show('warn','Error: '+e.message); }
  setTimeout(()=>busy=false, 2500);
}
$('go').onclick = () => redeem($('man').value);
$('cam').onclick = () => { sc = sc || new Html5Qrcode('reader'); sc.start({facingMode:'environment'},{fps:10,qrbox:240}, t=>redeem(t)); };
$('add').onclick = async () => {
  try {
    const rows = await rpc('add_guests', { p_pin: $('pin').value, p_names: $('names').value.split('\n') });
    $('tb').innerHTML = rows.map(g=>{const l=`${BASE}?to=${g.code}`;
      return `<tr><td>${g.name}</td><td><a href="https://wa.me/?text=${encodeURIComponent('Kepada Yth. '+g.name+', berikut undangan pernikahan Ridolf & Dewi: '+l)}" target="_blank">WA</a></td><td>${g.code}</td></tr>`}).join('');
  } catch(e){ alert(e.message); }
};
$('ref').onclick = async () => {
  try { const rows = await rpc('list_guests', { p_pin: $('pin').value });
    $('tb').innerHTML = rows.map(g=>`<tr><td>${g.name}</td><td>${g.redeemed_at?'✅':'—'}</td><td>${g.code}</td></tr>`).join('');
  } catch(e){ alert(e.message); }
};
</script></body></html>
